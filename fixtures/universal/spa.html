<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SPA fixture</title></head>
<body>
  <main id="app"><h1>Incident list</h1><button type="button" data-route="detail">Open incident INC-42</button></main>
  <script>
    const app = document.querySelector('#app');
    app.addEventListener('click', (event) => {
      if (!event.target.matches('[data-route="detail"]')) return;
      history.pushState({ incident: 'INC-42' }, '', '/spa/incident/INC-42');
      app.innerHTML = '<p>Incident detail</p><h1>INC-42 checkout latency</h1><p>Status: resolved</p><button type="button" data-route="list">Back to incidents</button>';
    });
    addEventListener('popstate', () => location.reload());
  </script>
</body>
</html>
