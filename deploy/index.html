<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071014"><title>ToolBraid · loading</title><style>html,body{margin:0;min-height:100%;background:#071014;color:#dff7f1;font:16px system-ui}main{min-height:100vh;display:grid;place-content:center;text-align:center}b{color:#63efd1}small{display:block;margin-top:.7rem;color:#8aa3a0}</style></head><body><main><div><b>ToolBraid</b><small>Loading the verified WebMCP runtime…</small></div></main><script>(async()=>{try{let b='';for(let i=0;i<8;i++){const r=await fetch('/c'+i+'.txt');if(!r.ok)throw new Error('chunk '+i+' '+r.status);b+=await r.text()}const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));const h=await new Response(s).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<main><div><b>ToolBraid failed to load.</b><small></small></div></main>';document.querySelector('small').textContent=e instanceof Error?e.message:String(e);console.error(e)}})();</script></body></html>
