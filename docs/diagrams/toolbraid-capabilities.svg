      <rect width="700" height="122" rx="20" fill="url(#card)" stroke="#2c323c"/>
      <rect x="694" y="1" width="5" height="120" rx="3" fill="#ff8cc8"/>
      <circle cx="56" cy="61" r="26" fill="#ff8cc8" fill-opacity="0.08" stroke="#ff8cc8" stroke-opacity="0.42"/>
      <path d="M56 46a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM42 75c3-7 8-10 14-10s11 3 14 10M65 48l6-6M67 42h4v4" fill="none" stroke="#ff8cc8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="101" y="48" fill="#f4f7fb" font-size="22" font-weight="720">Secure human handoff</text>
      <text x="101" y="80" fill="#9aa4b4" font-size="16">Login · 2FA · CAPTCHA handback · no credential storage</text>
      <text x="650" y="34" fill="#ff8cc8" font-size="12" font-weight="750" text-anchor="end" letter-spacing="1.4">SHIPPED</text>
    </g>

    <g transform="translate(832 676)">
      <rect width="700" height="122" rx="20" fill="url(#card)" stroke="#2c323c"/>
      <rect x="694" y="1" width="5" height="120" rx="3" fill="#ffd278"/>
      <circle cx="56" cy="61" r="26" fill="#ffd278" fill-opacity="0.08" stroke="#ffd278" stroke-opacity="0.42"/>
      <path d="M43 51h26v20H43zM48 57l5 4-5 4M57 65h7M63 47l5-5M68 42h4v4" fill="none" stroke="#ffd278" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="101" y="48" fill="#f4f7fb" font-size="22" font-weight="720">Codex/MCP bridge and audit</text>
      <text x="101" y="80" fill="#9aa4b4" font-size="16">Native Messaging · authenticated named pipe · receipts · SHA-256 chain</text>
      <text x="650" y="34" fill="#ffd278" font-size="12" font-weight="750" text-anchor="end" letter-spacing="1.4">SHIPPED</text>
