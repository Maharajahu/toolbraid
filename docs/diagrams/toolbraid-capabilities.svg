      <text x="101" y="80" fill="#9aa4b4" font-size="16">GitHub · Vercel · X · browser-observed postconditions for supported actions</text>
      <text x="650" y="34" fill="#77e7f4" font-size="12" font-weight="750" text-anchor="end" letter-spacing="1.4">SHIPPED</text>
    </g>

    <g transform="translate(68 676)">
      <rect width="700" height="122" rx="20" fill="url(#card)" stroke="#2c323c"/>
      <rect x="1" y="1" width="5" height="120" rx="3" fill="#77e7f4"/>
      <circle cx="56" cy="61" r="26" fill="#77e7f4" fill-opacity="0.08" stroke="#77e7f4" stroke-opacity="0.42"/>
      <path d="M43 53h26v18H43zM47 49h7M59 49h6M50 62l5-5 5 6 4-4 5 7" fill="none" stroke="#77e7f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="101" y="48" fill="#f4f7fb" font-size="22" font-weight="720">Multimodal evidence</text>
      <text x="101" y="80" fill="#9aa4b4" font-size="16">Visible screenshots · video keyframes · rendered audio · loaded captions</text>
      <text x="650" y="34" fill="#77e7f4" font-size="12" font-weight="750" text-anchor="end" letter-spacing="1.4">SHIPPED</text>
    </g>

    <g transform="translate(832 238)">
      <rect width="700" height="122" rx="20" fill="url(#card)" stroke="#2c323c"/>
      <rect x="694" y="1" width="5" height="120" rx="3" fill="#ff8cc8"/>
      <circle cx="56" cy="61" r="26" fill="#ff8cc8" fill-opacity="0.08" stroke="#ff8cc8" stroke-opacity="0.42"/>
      <path d="M48 59v-5a8 8 0 0 1 16 0v5M45 59h22v17H45zM56 65v5" fill="none" stroke="#ff8cc8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="101" y="48" fill="#f4f7fb" font-size="22" font-weight="720">Human authority</text>
      <text x="101" y="80" fill="#9aa4b4" font-size="16">Exact approval envelopes · one-time nonces · the agent cannot self-approve</text>
      <text x="650" y="34" fill="#ff8cc8" font-size="12" font-weight="750" text-anchor="end" letter-spacing="1.4">SHIPPED</text>
    </g>

    <g transform="translate(832 384)">
      <rect width="700" height="122" rx="20" fill="url(#card)" stroke="#2c323c"/>
      <rect x="694" y="1" width="5" height="120" rx="3" fill="#ff8cc8"/>
      <circle cx="56" cy="61" r="26" fill="#ff8cc8" fill-opacity="0.08" stroke="#ff8cc8" stroke-opacity="0.42"/>
      <circle cx="48" cy="53" r="4" fill="none" stroke="#ff8cc8" stroke-width="2"/><circle cx="64" cy="53" r="4" fill="none" stroke="#ff8cc8" stroke-width="2"/><circle cx="56" cy="69" r="4" fill="none" stroke="#ff8cc8" stroke-width="2"/><path d="M51 55l3 10M61 55l-3 10M52 53h8" stroke="#ff8cc8" stroke-width="2"/>
      <text x="101" y="48" fill="#f4f7fb" font-size="22" font-weight="720">Multi-page missions</text>
      <text x="101" y="80" fill="#9aa4b4" font-size="16">Up to 16 bound pages · drift rebind · exact pending-action ownership</text>
      <text x="650" y="34" fill="#ff8cc8" font-size="12" font-weight="750" text-anchor="end" letter-spacing="1.4">SHIPPED</text>
