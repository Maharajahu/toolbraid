      <path d="M47 54h18M47 60h12M47 66h8" stroke="#77e7f4" stroke-width="2" stroke-linecap="round"/>
      <text x="101" y="48" fill="#f4f7fb" font-size="22" font-weight="720">Universal browser layer</text>
      <text x="101" y="80" fill="#9aa4b4" font-size="16">Bounded DOM/ARIA discovery · local read, navigation, control and form tools</text>
      <text x="650" y="34" fill="#77e7f4" font-size="12" font-weight="750" text-anchor="end" letter-spacing="1.4">SHIPPED</text>
    </g>

    <g transform="translate(68 530)">
      <rect width="700" height="122" rx="20" fill="url(#card)" stroke="#2c323c"/>
      <rect x="1" y="1" width="5" height="120" rx="3" fill="#77e7f4"/>
      <circle cx="56" cy="61" r="26" fill="#77e7f4" fill-opacity="0.08" stroke="#77e7f4" stroke-opacity="0.42"/>
      <path d="M44 50h24v18H44zM49 45h14M50 57h12M50 63h8" fill="none" stroke="#77e7f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
