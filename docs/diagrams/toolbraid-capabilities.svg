  <text x="800" y="858" fill="#697386" font-family="Inter, Segoe UI, sans-serif" font-size="14" text-anchor="middle" letter-spacing="1.2">TOOLBRAID · SAFE CROSS-SITE EXECUTION FOR PEOPLE AND AGENTS</text>
