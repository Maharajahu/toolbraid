name: ToolBraid CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolbraid-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser validation runtime
        run: |
          python -m pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: Validate source, contracts, tests, smoke, and build
        run: npm run validate
      - name: Validate Universal runtime and extension build
        run: |
          node --test tests/universal/*.test.mjs
          node --test tests/v2/*.test.mjs
          node scripts/check-project.mjs
          node scripts/build-universal-extension.mjs
      - name: Validate the real desktop and mobile mission
        run: npm run test:e2e
